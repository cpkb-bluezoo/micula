# Build Javadoc and publish to GitHub Pages.
# Enable in repo Settings > Pages: Source = "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Javadoc
        run: ant javadoc-force

      - name: Stage site
        run: |
          mkdir -p _site/doc
          cp -r doc/. _site/doc/
          cat > _site/index.html << 'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>Micula</title></head>
          <body>
            <h1>Micula</h1>
            <p>Brotli codec in Java (RFC 7932).</p>
            <ul>
              <li><a href="doc/">API Documentation (Javadoc)</a></li>
              <li><a href="https://github.com/cpkb-bluezoo/micula/blob/main/README.md">README</a></li>
            </ul>
          </body></html>
          HTML

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
