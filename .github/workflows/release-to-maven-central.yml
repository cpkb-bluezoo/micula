name: Publish release

# Build, sign, and upload to Maven Central and GitHub Packages via
# scripts/publish-to-central.sh (which calls publish-to-github-packages.sh
# when GITHUB_TOKEN is set). Runnable locally for Central-only by omitting
# GITHUB_TOKEN. VERSION is auto-detected from pom.xml and cross-checked
# against build.xml.
#
# publishingType defaults to AUTOMATIC in the script (see its own
# comments): the bundle is uploaded and goes live on Central automatically
# once validation passes, no manual "Publish" click needed. A released
# version can never be deleted or overwritten once public, so this relies
# on the pipeline's version-mismatch guards and build having been proven
# out already - set PUBLISHING_TYPE=USER_MANAGED here to fall back to
# manual review at https://central.sonatype.com if ever needed.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Maven and reference brotli CLI
        run: sudo apt-get update && sudo apt-get install -y maven brotli

      - name: Run unit tests
        run: ant clean junit-test

      - name: Import GPG key
        id: gpg
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Allow loopback pinentry
        run: |
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent

      - name: Publish to Maven Central and GitHub Packages
        run: ./scripts/publish-to-central.sh
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.key_id }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEEP_BUNDLE_AT: ${{ github.workspace }}/central-bundle.zip

      - name: Upload artifact for inspection
        uses: actions/upload-artifact@v7
        with:
          name: central-bundle
          path: central-bundle.zip
