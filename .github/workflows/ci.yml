name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install reference brotli CLI
        run: sudo apt-get update && sudo apt-get install -y brotli

      - name: Run unit tests
        run: ant clean junit-test

      - name: JMH smoke (compile and short run)
        run: ant jmh-smoke
